<section class="meeting-page">
  <form class="meeting-card" id="meeting-form">
    <h1 id="meeting-page-title">Create Meeting</h1>

    <div class="meeting-form-grid">
      <div class="meeting-fields">
        <div class="meeting-field">
          <label for="meeting-topic">Meeting Topic</label>
          <input id="meeting-topic" name="topic" type="text" maxlength="200" placeholder="-" autocomplete="off" required>
        </div>

        <div class="meeting-field">
          <label for="meeting-date-time">Date and Time</label>
          <input id="meeting-date-time" name="dateTime" type="datetime-local" required>
        </div>

        <div class="meeting-field">
          <label for="meeting-location">Location / Meeting Channel</label>
          <input id="meeting-location" name="location" type="text" maxlength="1000"
            placeholder="Room name or meeting link" autocomplete="off">
        </div>
      </div>

      <div class="meeting-field meeting-description-field">
        <label for="meeting-description">Description</label>
        <textarea id="meeting-description" name="description" placeholder="-" rows="7"></textarea>
      </div>
    </div>

    <button class="meeting-submit" id="meeting-submit" type="submit">Submit</button>
    <p class="meeting-message" id="meeting-message" role="status" aria-live="polite" hidden></p>
  </form>
</section>
