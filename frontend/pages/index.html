<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../asset/image/logo2.png">
  <link rel="stylesheet" href="../css/index.css">
  <link rel="stylesheet" href="../css/project.css">
  <link rel="stylesheet" href="../css/creategroup.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/members.css">
  <link rel="stylesheet" href="../css/addmember.css">
  <link rel="stylesheet" href="../css/task.css">
  <link rel="stylesheet" href="../css/createTask.css">
  <title>Document</title>
</head>
<body>
  <!-- Navigation Bar-->
  <nav>
    <div class="logo" role="button" tabindex="0" aria-label="Go to projects">
      <img src="../asset/image/logo2.png" alt="logo">
    </div>
    <div class="right-nav">
      <button class="noti-icon" id="notificationTrigger" type="button" aria-label="Open notifications" aria-haspopup="dialog" aria-expanded="false" aria-controls="notificationDropdown">
        <img src="../asset/image/notification.svg" alt="notification">
        <div id="countNoti"></div>
      </button>
      <div class="user-profile" role="button" tabindex="0" aria-label="Open profile menu" aria-haspopup="menu" aria-expanded="false" aria-controls="profileDropdown">
        <img src="../asset/image/Profile 1.svg" alt="profile1">
      </div>
    </div>
  </nav>
  <iframe
    class="notification-dropdown"
    id="notificationDropdown"
    title="Notifications"
    src="notification.html"
    hidden
  ></iframe>
  <section class="profile-dropdown" id="profileDropdown" aria-label="Profile menu" hidden>
    <div class="profile-card">
      <div class="user-summary">
        <div class="user-details">
          <h1 id="profileName">Name</h1>
          <p class="user-status">
            <span id="profileStudentId">รหัสนักศึกษา</span>
          </p>
        </div>
        <div class="user-avatar" role="img" aria-label="Profile avatar">
          <img src="../asset/image/Profile 1.svg" alt="">
        </div>
      </div>
      <button class="menu-item theme-button" id="theme-button" type="button" aria-pressed="false">
        <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="m14 6 4 4M4 20l4-.8L19 8a2.1 2.1 0 0 0-3-3L5 16l-1 4Z" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" />
        </svg>
        <span>Change Theme</span>
      </button>
      <a class="menu-item sign-out-button" href="login.html">
        <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" />
        </svg>
        <span>Sign Out</span>
      </a>
    </div>
  </section>

  <!--Main Containerณณ-->
  <div class="main-container">
    <aside>
      <div id="slideBarMenu">
        <button class="sidebar-link sidebar-link-active" type="button" data-page="project" aria-current="page" aria-label="Home" title="Home">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" />
          </svg>
          <span>Home</span>
        </button>
        <button class="sidebar-link" type="button" data-page="creategroup" aria-label="Create Group" title="Create Group">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.8" />
          </svg>
          <span>Create Group</span>
        </button>
        <button class="sidebar-link" type="button" data-page="dashboard" data-project-context hidden aria-label="Dashboard" title="Dashboard">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M4 19V5m0 14h16M8 15v-4m4 4V7m4 8v-6" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" />
          </svg>
          <span>Dashboard</span>
        </button>
        <button class="sidebar-link" type="button" data-page="members" data-project-context hidden aria-label="Members" title="Members">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M16 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2m6-10a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm6-3a4 4 0 0 1 0 8m2 1h1a3 3 0 0 1 3 3v1" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" />
          </svg>
          <span>Members</span>
        </button>
        <button class="sidebar-link" type="button" data-page="task" data-project-context hidden aria-label="Tasks" title="Tasks">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" />
          </svg>
          <span>Tasks</span>
        </button>
      </div>
    </aside>
    <!--Display Box-->
    <main id="contentBox"></main>
  </div>
  <script src="../api/task-api.js"></script>
  <script src="../js/index.js"></script>
  <script src="../api/profile-api.js"></script>
  <script src="../js/profile.js"></script>
</body>
</html>
