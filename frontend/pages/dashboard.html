<div class="dashBoardpage">
    <div class="header-container">
        <div class="subject-head" id="subjectGroupDashboard"></div>
        <div class="group-name-head" id="groupNameDashboard"></div>
    </div>
    <div class="progress-container">
        <div class="progress-head">
            <h3>Progress</h3>
            <div class="percent" id="progressBarPercentageDashboard"></div>
        </div>
        <div class="progress-track">
            <div id="progressBardashboard" class="progress-fill" role="progressbar" aria-label="Project progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
        </div>
    </div>
    <div class="list-container">
        <div class="upcoming-list">
            <div class="head-list">
                <p class="head-title">Upcoming Activities</p>
                <button>All</button>
            </div>
            <div id="upcomingListDashboard"></div>
        </div>
        <div class="your-task-list">
            <div class="head-list">
                <p class="head-title">Your Task ToDay</p>
                <button>All</button>
            </div>
            <div id="yourTaskListDashboard"></div>
        </div>
    </div>
</div>
