<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link rel="stylesheet" href="../css/profile.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <main class="profile-page">
        <section class="profile-card" aria-label="Profile menu">
            <div class="user-summary">
                <div class="user-details">
                    <h1>Name</h1>
                    <p class="user-status">
                        <i class="fa-solid fa-share-nodes" aria-hidden="true"></i>
                        <span>online</span>
                    </p>
                </div>
                <div class="user-avatar" role="img" aria-label="Buttercup profile avatar">
                    <i class="fa-solid fa-user-astronaut" aria-hidden="true"></i>
                </div>
            </div>

            <button class="menu-item theme-button" id="theme-button" type="button" aria-pressed="false">
                <i class="fa-solid fa-pen-to-square menu-icon" aria-hidden="true"></i>
                <span>Change Theme</span>
            </button>

            <a class="menu-item sign-out-button" href="login.html">
                <i class="fa-solid fa-right-from-bracket menu-icon" aria-hidden="true"></i>
                <span>Sign Out</span>
            </a>
        </section>
    </main>

    <script src="../js/profile.js"></script>
</body>
</html>
