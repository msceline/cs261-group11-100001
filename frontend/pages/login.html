
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/login.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=League+Spartan:wght@100..900&display=swap');
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>
<body>
    <img src="../asset/image/logo.svg" alt="App Logo" class="my-logo">
    <div class="sign-in-card">
        <h1 class="title">Sign In</h1>
        <p class="subtitle">Hey, Enter your detail to get sign in<br>to your account</p>
        
        <form id="sign-in-form">
            <div class="input-field">
                <i class="fa-solid fa-user input-icon"></i>
                <input type="text" id="username" name="username" placeholder="Student ID" required autocomplete="username">
            </div>

            <div class="input-field">
                <i class="fa-solid fa-lock input-icon"></i>
                <input type="password" id="password" name="password" placeholder="Password" required>
            </div>

            <p class="login-message" id="login-message" role="alert" aria-live="polite"></p>
            <button type="submit" class="btn-signin">Sign In</button>
        </form>
    </div>

    <script src="../js/login.js"></script>
</body>
</html>
