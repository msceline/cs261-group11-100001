<section class="tasks-page">
    <header class="course-header">
        <div class="task-header-container"> 
            <h1 class="course-code" id="course-code"></h1>
            <h2 class="course-name" id="course-name"></h2>
        </div>
    </header>

    <section class="tasks-panel" aria-labelledby="tasks-heading">
        <div class="tasks-header">
            <h2 id="tasks-heading">TASKS</h2>
            <button class="add-task" id="createTaskIcon" type="button" aria-label="Create task">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4" /></svg>
            </button>
        </div>
        <div class="task-list" id="task-list" aria-live="polite"></div>
        <p class="task-list-message" id="task-message" role="status" aria-live="polite" hidden></p>
    </section>
</section>
