<div class="dashBoardpage">
    <div class="progress-container">
        <div class="progress-head">
            <div class="header-container">
                <div class="subject-head" id="subjectGroupDashboard"></div>
                <div class="group-name-head" id="groupNameDashboard"></div>
            </div>
            <button class="addMember-btn" type="button" aria-label="Add members" title="Add members">
                <svg xmlns="http://www.w3.org/2000/svg" class="bi bi-person-add" viewBox="0 0 16 16">
                    <path
                        d="M12.5 16a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7m.5-5v1h1a.5.5 0 0 1 0 1h-1v1a.5.5 0 0 1-1 0v-1h-1a.5.5 0 0 1 0-1h1v-1a.5.5 0 0 1 1 0m-2-6a3 3 0 1 1-6 0 3 3 0 0 1 6 0M8 7a2 2 0 1 0 0-4 2 2 0 0 0 0 4" />
                    <path
                        d="M8.256 14a4.5 4.5 0 0 1-.229-1.004H3c.001-.246.154-.986.832-1.664C4.484 10.68 5.711 10 8 10q.39 0 .74.025c.226-.341.496-.65.804-.918Q8.844 9.002 8 9c-5 0-6 3-6 4s1 1 1 1z" />
                </svg>
            </button>
        </div>
        <div class="progress-row">
            <div class="progress-track">
                <div id="progressBardashboard" class="progress-fill" role="progressbar" aria-label="Project progress"
                    aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
            </div>
            <div class="percent" id="progressBarPercentageDashboard"></div>
        </div>
    </div>
    <p class="project-create-warning" id="project-create-warning" role="alert" hidden></p>
    <div class="list-container">
        <div class="upcoming-list">
            <div class="head-list">
                <p class="head-title">Upcoming</p>
                <button class="addNewTask-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                        class="bi bi-plus-circle" viewBox="0 0 16 16">
                        <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16" />
                        <path
                            d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4" />
                    </svg>
                </button>
            </div>
            <div id="upcomingListDashboard"></div>
        </div>
        <div class="your-task-list">
            <div class="head-list">
                <p class="head-title">Task ToDay</p>
                <button class="addNewTask-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                        class="bi bi-plus-circle" viewBox="0 0 16 16">
                        <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16" />
                        <path
                            d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4" />
                    </svg>
                </button>
            </div>
            <div id="yourTaskListDashboard"></div>
        </div>
    </div>
</div>
